# Bookings Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookings
  namespace: petpay
  labels:
    app: bookings
    app.kubernetes.io/name: bookings
    app.kubernetes.io/part-of: petpay-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookings
  template:
    metadata:
      labels:
        app: bookings
        app.kubernetes.io/name: bookings
        app.kubernetes.io/part-of: petpay-app
    spec:
      containers:
        - name: bookings
          image: petpay-app-bookings:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bookings-config
            - secretRef:
                name: petpay-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petpay-secrets
                  key: DB_PASSWORD
                  optional: true
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: petpay-secrets
                  key: RABBITMQ_URL
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: bookings
                topologyKey: kubernetes.io/hostname
---
# Bookings Service - ClusterIP (internal communication)
apiVersion: v1
kind: Service
metadata:
  name: bookings
  namespace: petpay
  labels:
    app: bookings
    app.kubernetes.io/part-of: petpay-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
  selector:
    app: bookings
