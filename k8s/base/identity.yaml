# Identity Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: petpay
  labels:
    app: identity
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: petpay-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: petpay-app
    spec:
      containers:
        - name: identity
          image: petpay-app-identity:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: identity-config
            - secretRef:
                name: petpay-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: petpay-secrets
                  key: DATABASE_URL
                  optional: true
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: petpay-secrets
                  key: RABBITMQ_URL
                  optional: true
            - name: OAUTH_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: petpay-secrets
                  key: OAUTH_STATE_SECRET
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: petpay-secrets
                  key: JWT_SECRET
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: identity
                topologyKey: kubernetes.io/hostname
---
# Identity Service - ClusterIP (internal communication)
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: petpay
  labels:
    app: identity
    app.kubernetes.io/part-of: petpay-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app: identity
