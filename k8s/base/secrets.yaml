# Secrets para petpay-app
#
# WARNING: Do NOT store secret values in this file. Secrets are created via kubectl.
#
# Create secrets using the companion script:
#   k8s/scripts/create-secrets.sh              # Interactive (recommended)
#   k8s/scripts/create-secrets.sh --auto       # Placeholders (dev only)
#   k8s/scripts/create-secrets.sh --from-env .env  # From env file
#
# Or manually:
#   kubectl create secret generic petpay-secrets \
#     --namespace petpay \
#     --from-literal=DB_PASSWORD='your-password' \
#     --from-literal=JWT_SECRET='your-jwt-secret' \
#     ...
#
# This file exists only to declare the Secret resource so Kustomize
# references (secretRef) resolve properly during build.
apiVersion: v1
kind: Secret
metadata:
  name: petpay-secrets
  namespace: petpay
  labels:
    app.kubernetes.io/part-of: petpay-app
type: Opaque
