# Secrets para petpay-app (usar con kubectl create secret generic)
# Ejemplo: kubectl create secret generic petpay-secrets --from-literal=DB_HOST='postgres.petpay.svc.cluster.local' --from-literal=DB_PASSWORD='your-password' --from-literal=JWT_SECRET='your-jwt-secret'
apiVersion: v1
kind: Secret
metadata:
  name: petpay-secrets
  namespace: petpay
  labels:
    app.kubernetes.io/part-of: petpay-app
type: Opaque
stringData:
  # Database
  DB_HOST: "dev-postgres.petpay-dev.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "petpay"
  DB_USER: "postgres"
  DB_PASSWORD: "changeme"
  DATABASE_URL: "postgresql://postgres:changeme@dev-postgres.petpay-dev.svc.cluster.local:5432/petpay"
  
  JWT_SECRET: "changeme-jwt-secret-min-32-chars"
  JWT_SECRET_KEY: "changeme-jwt-secret-min-32-chars"
  JWT_EXPIRES_IN: "7d"
  
  # Message Queue
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.petpay-dev.svc.cluster.local:5672"
  
  # Email (ejemplo)
  MAIL_HOST: "smtp.example.com"
  MAIL_PORT: "587"
  MAIL_USER: "noreply@petpay.com"
  MAIL_PASSWORD: "changeme"
  EMAIL_USER: "noreply@petpay.com"
  EMAIL_APP_PASSWORD: "changeme"
  
  # OAuth (ejemplo)
  GOOGLE_CLIENT_ID: "changeme"
  GOOGLE_CLIENT_SECRET: "changeme"
  GITHUB_CLIENT_ID: "changeme"
  GITHUB_CLIENT_SECRET: "changeme"
  
  # OAuth State
  OAUTH_STATE_SECRET: "changeme-oauth-state-secret-min-32"
