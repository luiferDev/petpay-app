# Catalog & Offers Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: petpay
  labels:
    app: catalog
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: petpay-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: petpay-app
    spec:
      containers:
        - name: catalog
          image: petpay-app-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: catalog-config
            - secretRef:
                name: petpay-secrets
          env:
            - name: DB_HOST
              value: "dev-postgres.petpay-dev.svc.cluster.local"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: petpay-secrets
                  key: DB_USER
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petpay-secrets
                  key: DB_PASSWORD
                  optional: true
            - name: DB_NAME
              value: "petpay"
            - name: DB_PORT
              value: "5432"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: catalog
                topologyKey: kubernetes.io/hostname
---
# Catalog Service - ClusterIP (internal communication)
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: petpay
  labels:
    app: catalog
    app.kubernetes.io/part-of: petpay-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
  selector:
    app: catalog
