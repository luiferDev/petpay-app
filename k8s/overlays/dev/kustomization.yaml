# Kustomization for development environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petpay-dev

# Base configuration
resources:
  - ../../base

# Environment-specific name suffix
namePrefix: dev-

# Environment-specific labels
labels:
  - pairs:
      env: development

# Patch replicas for development (single instance)
replicas:
  - name: dev-identity
    count: 1
  - name: dev-marketplace
    count: 1
  - name: dev-catalog
    count: 1
  - name: dev-postgres
    count: 1

# Image tags for development
images:
  - name: petpay/identity
    newTag: dev-latest
  - name: petpay/marketplace
    newTag: dev-latest
  - name: petpay/catalog
    newTag: dev-latest
