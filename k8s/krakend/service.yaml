apiVersion: v1
kind: Service
metadata:
  name: krakend
  labels:
    app: krakend
spec:
  type: NodePort
  ports:
  - name: http
    port: 8000
    targetPort: 8080
    protocol: TCP
  selector:
    app: krakend
---
apiVersion: v1
kind: Service
metadata:
  name: krakend-internal
  labels:
    app: krakend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: krakend
