services:
  # Identity Service
  identity:
    build:
      context: ./Identity
      dockerfile: Dockerfile
    container_name: petpay-identity
    ports:
      - "3000:3000"
    env_file:
      - ./Identity/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:changeme@postgres:5432/petpay_identity
      - JWT_SECRET=changeme-jwt-secret-min-32-chars
      - JWT_EXPIRES_IN=7d
      - PORT=3000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - OAUTH_STATE_SECRET=changeme-oauth-state-secret-min-32
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - petpay-network
    restart: unless-stopped

  # Marketplace Service
  marketplace:
    build:
      context: ./marketplace
      dockerfile: Dockerfile
    container_name: petpay-marketplace
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=changeme
      - DB_NAME=petpay_marketplace
      - DB_PORT=5432
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petpay-network
    restart: unless-stopped

  # Catalog Service
  catalog:
    build:
      context: ./catalog-&-offers
      dockerfile: Dockerfile
    container_name: petpay-catalog
    ports:
      - "8081:8081"
    environment:
      - GIN_MODE=release
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=changeme
      - DB_NAME=petpay_catalog
      - DB_PORT=5432
      - PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petpay-network
    restart: unless-stopped

  # Bookings Service
  bookings:
    build:
      context: ./bookings-service
      dockerfile: Dockerfile
    container_name: petpay-bookings
    ports:
      - "8082:8082"
    environment:
      - GIN_MODE=release
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=changeme
      - DB_NAME=petpay_bookings
      - DB_PORT=5432
      - PORT=8082
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - petpay-network
    restart: unless-stopped

  # Payments Service
  payments:
    build:
      context: ./payments-service
      dockerfile: Dockerfile
    container_name: petpay-payments
    ports:
      - "8083:8083"
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - APP_DATABASE__URL=postgresql://postgres:changeme@postgres:5432/petpay_payments
      - APP_SERVER__PORT=8083
      - APP_SERVER__HOST=0.0.0.0
      - APP_JWT__SECRET=changeme-jwt-secret-min-32-chars
      - APP_STRIPE__API_KEY=${STRIPE_API_KEY:-sk_test_placeholder}
      - APP_PAYPAL__CLIENT_ID=${PAYPAL_CLIENT_ID:-placeholder}
      - APP_PAYPAL__CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-placeholder}
      - APP_PAYPAL__MODE=sandbox
      - APP_IDENTITY__SERVICE_URL=http://identity:3000
      - APP_IDENTITY__SERVICE_API_KEY=changeme-identity-api-key
      - APP_MARKETPLACE__SERVICE_URL=http://marketplace:8080
      - APP_PDF__STORAGE_PATH=/app/pdfs
    volumes:
      - ./payments-service/.env.example:/app/.env:ro
      - pdf-storage:/app/pdfs
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
    networks:
      - petpay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: petpay-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - petpay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: petpay-postgres
    environment:
      - POSTGRES_DB=petpay
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=changeme
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - petpay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for Refresh Tokens
  redis:
    image: redis:7-alpine
    container_name: petpay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - petpay-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # KrakenD API Gateway (replaces nginx)
  krakend:
    build:
      context: ./krakend
      dockerfile: Dockerfile
    container_name: petpay-krakend
    ports:
      - "8000:8080"
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json:ro
    depends_on:
      identity:
        condition: service_started
      marketplace:
        condition: service_started
      catalog:
        condition: service_started
      bookings:
        condition: service_started
      payments:  # Add payments dependency
        condition: service_started
    networks:
      - petpay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # DEPRECATED: Nginx replaced by KrakenD
  # Keeping for reference - can be removed after migration
  # nginx:
  #   image: nginx:alpine
  #   container_name: petpay-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - identity
  #     - marketplace
  #     - catalog
  #     - bookings
  #   networks:
  #     - petpay-network
  #   restart: unless-stopped

networks:
  petpay-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  pdf-storage:
