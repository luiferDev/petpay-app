name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: '1.25'
  BUN_VERSION: '1.3'
  RUST_VERSION: '1.85'
  POSTGRES_VERSION: '16-alpine'

jobs:
  # ── Lint ─────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            marketplace/go.sum
            catalog-&-offers/go.sum
            bookings-service/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Lint Identity (TypeScript)
        working-directory: ./Identity
        run: |
          bun install
          bun run lint:fix

      - name: Lint Go services
        run: |
          for dir in marketplace "catalog-&-offers" bookings-service; do
            echo "::group::$dir"
            (cd "$dir" && go fmt ./... && go vet ./...)
            echo "::endgroup::"
          done

      - name: Lint Payments (Rust)
        working-directory: ./payments-service
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings

  # ── Unit Tests ───────────────────────────────
  unit-tests:
    name: Unit Tests / ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_DB: petpay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service:
          - name: Identity
            dir: ./Identity
            language: bun
            cmd: bun test --coverage
          - name: Marketplace
            dir: ./marketplace
            language: go
            cmd: go test -v -short ./...
          - name: Catalog
            dir: ./catalog-&-offers
            language: go
            cmd: go test -v -short ./...
          - name: Bookings
            dir: ./bookings-service
            language: go
            cmd: go test -v -short ./...
          - name: Payments
            dir: ./payments-service
            language: rust
            cmd: cargo test --lib

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        if: matrix.service.language == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Go
        if: matrix.service.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.service.dir }}/go.sum

      - name: Setup Rust
        if: matrix.service.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Bun dependencies
        if: matrix.service.language == 'bun'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('Identity/bun.lock') }}

      - name: Cache Rust dependencies
        if: matrix.service.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.service.dir }}

      - name: Install dependencies
        working-directory: ${{ matrix.service.dir }}
        run: |
          case "${{ matrix.service.language }}" in
            bun)  bun install ;;
            rust) cargo fetch ;;
            go)   go mod download ;;
          esac

      - name: Run tests
        working-directory: ${{ matrix.service.dir }}
        run: ${{ matrix.service.cmd }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petpay_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-min-32-chars-long-enough
          RABBITMQ_URL: amqp://guest:guest@localhost:5672

  # ── Integration Tests ────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run integration test suite
        working-directory: ./tests/integration
        run: bash run.sh
        env:
          CI: true

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f tests/integration/docker-compose.test.yml \
            -p petpay-test logs --tail=100

  # ── Docker Build Check ──────────────────────
  docker-build:
    name: Docker Build / ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [unit-tests]

    strategy:
      matrix:
        service:
          - name: Identity
            dockerfile: ./Identity/Dockerfile
          - name: Marketplace
            dockerfile: ./marketplace/Dockerfile
          - name: Catalog
            dockerfile: ./catalog-&-offers/Dockerfile
          - name: Bookings
            dockerfile: ./bookings-service/Dockerfile
          - name: Payments
            dockerfile: ./payments-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          tag="petpay-$(echo "${{ matrix.service.name }}" | tr '[:upper:]' '[:lower:]')"
          docker build -t "$tag" -f ${{ matrix.service.dockerfile }} .
